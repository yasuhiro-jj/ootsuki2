name: gps-sales

on:
  pull_request:
    paths:
      - "apps/gps-sales/**"
      - ".github/workflows/gps-sales.yml"
  push:
    branches: [main]
    paths:
      - "apps/gps-sales/**"
      - ".github/workflows/gps-sales.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gps-sales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/gps-sales/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
